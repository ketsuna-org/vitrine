# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Bot Creator
email: contact@bot-creator.fr
description: >- # this means to ignore newlines until "baseurl:"
  Bot Creator helps you build, run, and monitor Discord bots without code
  from mobile, desktop, or the Docker runner.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://bot-creator.fr" # the base hostname & protocol for your site, e.g. http://example.com
twitter_username: garder500
github_username:  ketsuna-org
author: Garder500
lang: en

# Build settings
ignore_theme_config: true
# theme: minima
plugins:
  - jekyll-postcss
  - jekyll-feed
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-toc

postcss:
  cache: false
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

paginate: 5  # Posts per page
paginate_path: "/blog/page:num/"

future: true

collections:
  docs:
    output: true
    permalink: /docs/:path/

defaults:
  # Default social preview image (1200x630); a page can override it with its own `image:`.
  - scope:
      path: ""
    values:
      image: /assets/images/og-default.png
  # Documentation pages are reference articles, not blog posts.
  - scope:
      path: ""
      type: docs
    values:
      seo:
        type: TechArticle
  # Not for search engines (also disallowed in robots.txt): keep them out of the sitemap.
  - scope:
      path: "admin"
    values:
      sitemap: false
  - scope:
      path: "oauth"
    values:
      sitemap: false

include:
  - .well-known
  - _redirects

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
exclude:
  - .devenv/
  - .direnv/
  - .devenv.flake.nix
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - package.json
  - package-lock.json
  - devenv.nix
  - devenv.lock
  - postcss.config.js
  - tailwind.config.js
  - README.md

watch_exclude:
  - .devenv/
  - .direnv/
  - .devenv.flake.nix
