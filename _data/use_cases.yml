        - "Ajoutez *Répondre avec un message* avec du texte, des embeds et des boutons. Lisez la saisie de l'utilisateur avec `((opts.nom_de_l_option))` et son nom avec `((user.username))`."
        - "Ajoutez de la logique au besoin : *Bloc SI / SINON*, *Choix aléatoire*, *Cooldown*, *Requête HTTP*, et des variables pour se souvenir de choses d'une exécution à l'autre."
        - "Vérifiez le message dans le playground avant de déployer."
      blocks:
