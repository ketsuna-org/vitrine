        - { type: randomChoice, note: "Choisit un élément au hasard dans une liste." }
        - { type: cooldown, note: "Limite la fréquence d'utilisation d'une commande." }
        - { type: httpRequest, note: "Appelle une API externe et lit le résultat." }
        - { type: setScopedVariable, note: "Stocke une valeur par serveur, membre, salon…" }
      limits:
