# Prices as returned by Google Play and the App Store (production catalog, read-only, 2026-10-29).
# Reference currency: EUR (identical across France, Germany and the other euro countries read).
# Update this file, and the date, whenever the store prices change.
read_on: "2026-10-29"
reference_currency: "EUR"
other_currency: "USD"
plans:
  - id: premium
    period_month: true
    period_year: true
    google_play: { eur_month: "5.99", eur_year: "59.99", usd_month: "5.99", usd_year: "59.99" }
    app_store:   { eur_month: "5.99", eur_year: "59.99", usd_month: "4.99", usd_year: "49.99" }
  - id: host_one
    google_play: { eur_month: "5.99", usd_month: "5.49" }
    app_store:   { eur_month: "4.99", usd_month: "3.99" }
  - id: host_two
    google_play: { eur_month: "8.99", usd_month: "8.49" }
    app_store:   { eur_month: "7.99", usd_month: "6.99" }
ai_packs:
  - { id: mini, credits: "800", eur: "1" }
  - { id: discovery, credits: "3,000", eur: "3" }
  - { id: advanced, credits: "12,000", eur: "10" }
  - { id: studio, credits: "25,000", eur: "19.99" }

# Bot plans: production catalog (published offers), EUR, read 2026-11-23. Bots = bots running at the same time (0 = unlimited).
catalog_read_on: "2026-11-23"
bot_plans:
  - { id: free,      bots: 1 }
  - { id: one,       bots: 1, eur_month: "3",     eur_year: "30" }
  - { id: premium,   bots: 2, eur_month: "5.99",  eur_year: "59.99", credits: "1,500", highlight: true }
  - { id: four,      bots: 4, eur_month: "10",    eur_year: "100",   credits: "3,000" }
  - { id: unlimited, bots: 0, eur_month: "14",    eur_year: "150",   credits: "5,000" }
