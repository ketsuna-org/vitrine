# Public API marketing page (EN and FR). Every claim is checked against the Manager OpenAPI contract
# (Manager dev ec2256c, internal/api/openapi/v1.json). Premium only. Do not add anything the API does not do.
en:
  title: "Bot Creator public API: manage your Discord bot from code"
  description: "Manage your Bot Creator bot from your own code: commands, workflows and variables over a REST API with scoped API keys. Publish to Discord when you decide. Premium only."
  badge: "Premium only"
  h1: "Manage your bot from your own code"
  intro: "The Bot Creator public API is a JSON REST API for the bots you build. Create commands, edit workflows and write variables from a script, a CI job or your own tool, with an API key that can only do what you allow."
  premium: "API keys need an active Premium plan. Without Premium the keys are kept but their calls are refused until it comes back."
  cta_docs: "Read the guide"
  cta_ref: "Endpoint reference"
  cta_studio: "Create a key in the Studio"
  items:
    - title: "One key, one bot"
      body: "A key is tied to a single bot. It cannot see your other bots, and it is refused everywhere outside the API."
    - title: "Scopes you choose"
      body: "Five scopes: read, write commands, publish commands, write workflows, write variables. Give a key the minimum it needs."
    - title: "Create now, publish later"
      body: "A command created through the API stays in Bot Creator until you publish it to Discord, globally or on chosen servers. You can take it off Discord and keep it."
    - title: "Safe by design"
      body: "Keys are shown once and stored hashed. They expire (90 days by default), can be rotated with a grace period and revoked in seconds. Writes are audited and rate limited per key."
    - title: "Checked before it is saved"
      body: "The server compiles commands and workflows on write. An error is returned with details and nothing is saved."
    - title: "OpenAPI included"
      body: "The OpenAPI 3.1 contract is public, so you can generate a client in the language you like."
  example_title: "A first call"
  not_yet_title: "Not in the API yet"
  not_yet: "Starting and stopping the bot, execution logs, statistics, triggers and webhooks are not available through the API today. Keys are managed in the Studio, not in the mobile app."
fr:
  title: "API publique de Bot Creator : pilotez votre bot Discord depuis du code"
  description: "Pilotez votre bot Bot Creator depuis votre propre code : commandes, workflows et variables via une API REST et des clés API à permissions. Publication sur Discord quand vous le décidez. Réservé à Premium."
  badge: "Réservé à Premium"
  h1: "Pilotez votre bot depuis votre propre code"
  intro: "L'API publique de Bot Creator est une API REST JSON pour les bots que vous créez. Créez des commandes, modifiez des workflows et écrivez des variables depuis un script, une tâche d'intégration continue ou votre propre outil, avec une clé API qui ne peut faire que ce que vous autorisez."
  premium: "Les clés API demandent un abonnement Premium actif. Sans Premium, les clés sont conservées mais leurs appels sont refusés jusqu'à son retour."
  cta_docs: "Lire le guide"
  cta_ref: "Référence des routes"
  cta_studio: "Créer une clé dans le Studio"
  items:
    - title: "Une clé, un bot"
      body: "Une clé est liée à un seul bot. Elle ne voit pas vos autres bots, et elle est refusée partout en dehors de l'API."
    - title: "Des permissions à votre choix"
      body: "Cinq permissions : lecture, écriture des commandes, publication des commandes, écriture des workflows, écriture des variables. Donnez à une clé le minimum dont elle a besoin."
    - title: "Créer maintenant, publier plus tard"
      body: "Une commande créée par l'API reste dans Bot Creator jusqu'à ce que vous la publiiez sur Discord, globalement ou sur des serveurs choisis. Vous pouvez la retirer de Discord et la garder."
    - title: "Sûre par conception"
      body: "Les clés ne sont affichées qu'une fois et stockées hachées. Elles expirent (90 jours par défaut), se renouvellent avec un délai de grâce et se révoquent en quelques secondes. Les écritures sont journalisées et limitées par clé."
    - title: "Vérifié avant d'être enregistré"
      body: "Le serveur compile les commandes et les workflows à l'écriture. Une erreur est renvoyée avec ses détails et rien n'est enregistré."
    - title: "OpenAPI fournie"
      body: "Le contrat OpenAPI 3.1 est public : vous pouvez générer un client dans le langage de votre choix."
  example_title: "Un premier appel"
  not_yet_title: "Pas encore dans l'API"
  not_yet: "Démarrer et arrêter le bot, les journaux d'exécution, les statistiques, les déclencheurs et les webhooks ne sont pas disponibles par l'API aujourd'hui. Les clés se gèrent dans le Studio, pas dans l'application mobile."
