faq:
  title: "Questions fréquentes"
  eyebrow: "FAQ"
  subtitle: "Des réponses courtes sur ce qu'est Bot Creator, ce qu'il coûte et où tourne votre bot."
  more_title: "Une autre question ?"
  more_body: "Rejoignez la communauté Discord, ou lisez la documentation (en anglais)."
  items:
    - q: "Bot Creator est-il gratuit ?"
      a: "Vous pouvez le télécharger gratuitement. La version gratuite des apps affiche des publicités (Google AdMob) ; un abonnement payant, acheté dans les stores, les retire. Les prix sont fixés par les stores et peuvent varier selon le pays."
    - q: "Faut-il savoir programmer ?"
      a: "Non. Vous pouvez construire vos commandes avec des blocs visuels. Si vous voulez plus de contrôle, vous pouvez écrire des $fonctions BDFD ou du JavaScript."
    - q: "Puis-je créer un bot depuis mon téléphone ?"
      a: "Oui. Bot Creator est sur Google Play et l'App Store, et vous pouvez créer et modifier vos commandes depuis votre téléphone."
    - q: "Où tourne mon bot ?"
      a: "Vous pouvez l'héberger depuis l'app, ou le faire tourner vous-même avec le runner Docker, sur un serveur Linux ou un Raspberry Pi, pour qu'il reste en ligne. Le guide du runner Docker (en anglais) détaille les étapes."
    - q: "Le jeton de mon bot est-il en sécurité ?"
      a: "Si vous utilisez seulement l'app avec votre propre bot et les fonctions locales, le jeton reste sur votre appareil, dans le stockage sécurisé du système. Si vous vous connectez avec Discord, utilisez l'hébergement cloud, le Copilot ou la console web et enregistrez votre bot dans le cloud, le jeton est stocké sur nos serveurs, chiffré au repos. Les détails sont dans la politique de confidentialité (en anglais). Ne partagez jamais votre jeton."
    - q: "Puis-je utiliser du code BDFD ?"
      a: "Bot Creator exécute des commandes écrites avec des $fonctions de type BDFD. La référence liste chaque fonction avec sa syntaxe et un exemple ; consultez-la pour savoir ce qui est pris en charge. Le playground affiche seulement un aperçu du message qu'enverrait un extrait, il ne l'exécute pas."
    - q: "Puis-je essayer sans rien installer ?"
      a: "Oui, dans le playground. Modifiez des blocs ou collez un extrait BDFD et voyez le message Discord qu'il afficherait. Tout se passe dans votre navigateur : rien n'est envoyé et rien n'est exécuté."
    - q: "La documentation existe-t-elle en français ?"
      a: "La documentation et les guides sont en anglais. L'accueil, la page de téléchargement et cette FAQ existent aussi en français."

