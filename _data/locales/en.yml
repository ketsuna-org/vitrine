faq:
  title: "Frequently asked questions"
  eyebrow: "FAQ"
  subtitle: "Short answers about what Bot Creator is, what it costs and where your bot runs."
  more_title: "Still have a question?"
  more_body: "Join the Discord community, or read the documentation."
  items:
    - q: "Is Bot Creator free?"
      a: "You can download it for free. The free version of the apps shows ads (Google AdMob); a paid subscription, bought in the app stores, removes them. Prices are set by the stores and can vary by country."
    - q: "Do I need to know how to code?"
      a: "No. You can build commands with visual blocks. If you want more control, you can write BDFD $functions or JavaScript."
    - q: "Can I build a bot from my phone?"
      a: "Yes. Bot Creator is on Google Play and the App Store, and you can create and edit commands from your phone."
    - q: "Where does my bot run?"
      a: "You can host it from the app, or run it yourself with the Docker runner on a Linux server or a Raspberry Pi so that it stays online. See the Docker runner guide for the steps."
    - q: "Is my bot token safe?"
      a: "If you only use the app with your own bot and local features, the token stays on your device, in the system secure storage. If you sign in with Discord, use cloud hosting, the Copilot or the web console and save your bot to the cloud, the token is stored on our servers, encrypted at rest. Details are in the privacy policy. Never share your token."
    - q: "Can I use BDFD code?"
      a: "Bot Creator runs commands written with BDFD-style $functions. The reference lists each function with its syntax and an example; check it for what is supported. The playground only previews the message a snippet would send, it does not run the snippet."
    - q: "Can I try it without installing anything?"
      a: "Yes, in the playground. Edit blocks or paste a BDFD snippet and see the Discord message it would draw. It runs in your browser: nothing is sent anywhere and nothing is executed."
    - q: "Is the documentation available in French?"
      a: "The documentation and the guides are in English. The home page, the download page and this FAQ are also available in French."
    - q: "What data is measured?"
      a: "The website counts visits without any cookie or identifier (Cloudflare Web Analytics), and only reads aggregated figures. On our servers, each account keeps the dates of a few first events (first bot saved, started, command run, purchase) to improve onboarding, with no message content or token; they are deleted with the account. If you accept analytics in the app, it can also send once where the installation came from and a few local milestones. The question \"How did you hear about us?\" is optional and asked once. The privacy policy gives the details."


