<script>
document.addEventListener('DOMContentLoaded', () => {
  const sidebar = document.getElementById('docs-sidebar');
  if (!sidebar) return;
  const currentPath = window.location.pathname.replace(/\/$/, '') || '/';
  sidebar.querySelectorAll('a[href]').forEach(link => {
    const path = new URL(link.href, window.location.origin).pathname.replace(/\/$/, '') || '/';
    const active = path === currentPath;
    link.classList.toggle('bg-accent-deep', active);
    link.classList.toggle('text-primary', active);
    link.classList.toggle('border-primary/20', active);
    if (active) link.setAttribute('aria-current', 'page');
    else link.removeAttribute('aria-current');
  });
  const activeItem = sidebar.querySelector('[aria-current="page"]');
  if (activeItem && window.innerWidth >= 1024) {
    const scroller = sidebar.querySelector('.docs-sidebar-inner');
    if (scroller) scroller.scrollTop = Math.max(0, activeItem.offsetTop - scroller.clientHeight / 2);
  }
  const buttons = [...sidebar.querySelectorAll('[data-toggle-target]')];
  const setGroup = (button, expanded) => {
    const list = document.getElementById(button.dataset.toggleTarget);
    if (!list) return;
    list.classList.toggle('hidden', !expanded);
    button.setAttribute('aria-expanded', String(expanded));
    button.setAttribute('aria-controls', list.id);
    document.getElementById(list.id + '-arrow')?.classList.toggle('rotate-180', expanded);
  };
  buttons.forEach(button => {
    const list = document.getElementById(button.dataset.toggleTarget);
    if (!list) return;
    setGroup(button, !list.classList.contains('hidden'));
    button.addEventListener('click', () => setGroup(button, list.classList.contains('hidden')));
  });
});
</script>
