<script>
document.addEventListener('DOMContentLoaded', () => {
  const sidebar = document.getElementById('docs-sidebar');
  if (!sidebar) return;
  const currentPath = window.location.pathname.replace(/\/$/, '') || '/';
  sidebar.querySelectorAll('a[href]').forEach(link => {
    const path = new URL(link.href, window.location.origin).pathname.replace(/\/$/, '') || '/';
    const active = path === currentPath;
    link.classList.toggle('bg-primary/10', active);
    link.classList.toggle('text-primary', active);
    link.classList.toggle('border-primary/20', active);
    if (active) link.setAttribute('aria-current', 'page');
    else link.removeAttribute('aria-current');
  });
  const activeItem = sidebar.querySelector('[aria-current="page"]');
  if (activeItem && window.innerWidth >= 1024) {
    const scroller = sidebar.querySelector('.docs-sidebar-inner');
    if (scroller) scroller.scrollTop = Math.max(0, activeItem.offsetTop - scroller.clientHeight / 2);
  }
  const buttons = [...sidebar.querySelectorAll('[data-toggle-target]')];
  const setGroup = (button, expanded) => {
    const list = document.getElementById(button.dataset.toggleTarget);
    if (!list) return;
    list.classList.toggle('hidden', !expanded);
    button.setAttribute('aria-expanded', String(expanded));
    button.setAttribute('aria-controls', list.id);
    document.getElementById(list.id + '-arrow')?.classList.toggle('rotate-180', expanded);
  };
  buttons.forEach(button => {
    const list = document.getElementById(button.dataset.toggleTarget);
    if (!list) return;
    setGroup(button, !list.classList.contains('hidden'));
    button.addEventListener('click', () => setGroup(button, list.classList.contains('hidden')));
  });
  const searchInput = sidebar.querySelector('#sidebar-search-input');
  if (!searchInput) return;
  const items = [...sidebar.querySelectorAll('.sidebar-item')];
  let savedGroups = null;
  searchInput.addEventListener('input', () => {
    const query = searchInput.value.toLowerCase().trim();
    if (query && !savedGroups) savedGroups = new Map(buttons.map(button => [button, button.getAttribute('aria-expanded') === 'true']));
    items.forEach(item => {
      const term = item.dataset.searchTerm || item.textContent;
      item.closest('li').style.display = !query || term.toLowerCase().includes(query) ? '' : 'none';
    });
    buttons.forEach(button => {
      const list = document.getElementById(button.dataset.toggleTarget);
      const group = button.closest('.sidebar-cat-group');
      if (!list) return;
      if (query) {
        const visible = [...list.querySelectorAll('li')].some(item => item.style.display !== 'none');
        if (group) group.style.display = visible ? '' : 'none';
        setGroup(button, visible);
      } else {
        if (group) group.style.display = '';
        if (savedGroups) setGroup(button, savedGroups.get(button));
      }
    });
    if (!query) savedGroups = null;
  });
});
</script>
