{% assign nav = site.data.docs_nav.javascript_api %}

<div class="flex flex-col gap-6">
  {% include docs_search.html %}

  <div class="sidebar-group">
    <div class="text-xs font-bold text-on-surface-variant uppercase tracking-widest mb-2 px-2 py-1 flex items-center gap-2">
      <svg class="pxicon text-base" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none"><use href="{{ '/assets/icons/pixelarticons.svg' | relative_url }}#terminal"></use></svg>
      JavaScript API
    </div>
    <ul class="flex flex-col gap-1">
      {% for item in nav %}
        <li>
          <a href="{{ item.path | relative_url }}"
             class="sidebar-item block px-3 py-1.5 rounded-lg text-sm transition-all {% if page.url == item.path %}bg-primary/10 text-primary font-bold border border-primary/20{% else %}text-on-surface-variant hover:bg-surface-container hover:text-on-surface{% endif %}"
             data-search-term="{{ item.title | downcase }}">
            {{ item.title }}
          </a>
        </li>
      {% endfor %}
    </ul>
  </div>

  <div class="border-t border-outline-variant pt-4">
    <a href="{{ '/docs/' | relative_url }}" class="text-sm font-medium text-on-surface-variant hover:text-primary transition-colors flex items-center gap-2">
      <svg class="pxicon text-base" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none"><use href="{{ '/assets/icons/pixelarticons.svg' | relative_url }}#code"></use></svg>
      BDFD Function Reference
    </a>
  </div>
</div>

{% include sidebar_scripts.html %}
