{% assign locale = include.locale %}
{% assign t = site.data.locales[locale] %}
<!DOCTYPE html>
<html lang="{{ locale }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d1117">
  <!-- Preconnect to critical origins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://pagead2.googlesyndication.com">
  <link rel="dns-prefetch" href="https://fundingchoicesmessages.google.com">

  <!-- Google Fonts loaded asynchronously to prevent render blocking -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"></noscript>

  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=arrow_back,arrow_forward,bolt,calendar_today,category,check,check_circle,chevron_right,close,code,construction,content_copy,dashboard,delete,deployed_code,description,diamond,download,expand_more,folder_open,gavel,help,history,info,language,laptop,library_books,lightbulb,menu,menu_book,menu_open,open_in_new,payments,phone_android,phone_iphone,priority_high,public,report,rocket_launch,search,search_off,security,settings,share,smart_toy,smartphone,sports_esports,sync_alt,terminal,warning&display=block" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=arrow_back,arrow_forward,bolt,calendar_today,category,check,check_circle,chevron_right,close,code,construction,content_copy,dashboard,delete,deployed_code,description,diamond,download,expand_more,folder_open,gavel,help,history,info,language,laptop,library_books,lightbulb,menu,menu_book,menu_open,open_in_new,payments,phone_android,phone_iphone,priority_high,public,report,rocket_launch,search,search_off,security,settings,share,smart_toy,smartphone,sports_esports,sync_alt,terminal,warning&display=block" rel="stylesheet"></noscript>

  <!-- Main stylesheet loaded synchronously to prevent Flash of Unstyled Content (FOUC) -->
  <link rel="stylesheet" href="{{ '/css/main.css' | relative_url }}">

  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/favicon-32x32.png' | relative_url }}">
  <link rel="icon" type="image/webp" sizes="192x192" href="{{ '/assets/favicon-192x192.webp' | relative_url }}">
  <link rel="shortcut icon" href="{{ '/assets/favicon-32x32.png' | relative_url }}">

  <!-- Preload critical hero image for LCP improvement -->
  <link rel="preload" as="image" href="{{ '/assets/images/screenshots/iphone/screen-1-create-host.webp' | relative_url }}" fetchpriority="high">

  {% if include.markdown %}
  <link href="{{ '/css/highlight.css' | relative_url }}" rel="stylesheet">
  <link href="{{ '/css/markdown.css' | relative_url }}" rel="stylesheet">
  {% endif %}
  {% seo %}
  <link rel="alternate" hreflang="en" href="{{ page.url | absolute_url }}">
  <link rel="alternate" hreflang="x-default" href="{{ site.data.locales.en.paths.home | absolute_url }}">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9146609240142753" crossorigin="anonymous"></script>
</head>
