{% assign locale = include.locale %}
{% assign t = site.data.locales[locale] %}
<!DOCTYPE html>
<html lang="{{ locale }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0D0D0F">
  <!-- Preconnect to critical origins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Google Fonts loaded asynchronously to prevent render blocking -->
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet"></noscript>


  <script>document.documentElement.classList.add('cs');</script>
  <script src="{{ '/assets/js/scrollbar.js' | relative_url }}" defer></script>

  <!-- Main stylesheet loaded synchronously to prevent Flash of Unstyled Content (FOUC) -->
  <link rel="stylesheet" href="{{ '/css/main.css' | relative_url }}">

  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/favicon-32x32.png' | relative_url }}">
  <link rel="icon" type="image/webp" sizes="192x192" href="{{ '/assets/favicon-192x192.webp' | relative_url }}">
  <link rel="shortcut icon" href="{{ '/assets/favicon-32x32.png' | relative_url }}">

  <!-- Preload critical hero image for LCP improvement -->
  {% if page.url == '/' %}
  <link rel="preload" as="image" href="{{ '/assets/images/screenshots/mobile/home_small.webp' | relative_url }}" imagesrcset="{{ '/assets/images/screenshots/mobile/home_small.webp' | relative_url }} 480w, {{ '/assets/images/screenshots/mobile/home_medium.webp' | relative_url }} 800w, {{ '/assets/images/screenshots/mobile/home.webp' | relative_url }} 1080w" imagesizes="(max-width: 767px) calc(100vw - 48px), 320px" fetchpriority="high">
  {% endif %}

  {% if include.markdown %}
  <link href="{{ '/css/highlight.css' | relative_url }}" rel="stylesheet">
  <link href="{{ '/css/markdown.css' | relative_url }}" rel="stylesheet">
  {% endif %}
  {% seo %}
  <link rel="alternate" hreflang="en" href="{{ page.url | absolute_url }}">
  <link rel="alternate" hreflang="x-default" href="{{ site.data.locales.en.paths.home | absolute_url }}">
  <script src="{{ '/assets/js/consent.js' | relative_url }}" defer></script>
</head>
