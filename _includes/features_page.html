{% assign t = site.data.locales[page.locale] %}
{% assign c = site.data.features[page.locale] %}
<div class="mx-auto max-w-[900px] px-4 py-14 sm:px-6 lg:py-20">
  <header class="mb-10 flex flex-col gap-3">
    <h1 class="m-0 text-4xl font-semibold leading-tight tracking-tight sm:text-5xl">{{ c.h1 }}</h1>
    <p class="m-0 text-lg leading-relaxed text-on-surface-variant">{{ c.intro }}</p>
  </header>
  {% for item in c.items %}
  <section id="{{ item.id }}" class="mb-10 flex flex-col gap-3 border-t border-outline pt-6">
    <h2 class="m-0 text-2xl font-semibold">{{ item.title }}</h2>
    <p class="m-0 leading-relaxed text-on-surface-variant">{{ item.body }}</p>
    <p class="m-0"><a class="text-primary underline underline-offset-2" href="{{ item.link.url | relative_url }}">{{ item.link.label }}</a></p>
  </section>
  {% endfor %}
</div>
